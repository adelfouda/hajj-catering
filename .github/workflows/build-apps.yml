# بناء تطبيق أندرويد وتطبيق ويندوز ورفعهم على الموقع في مجلد downloads
name: Build desktop and mobile apps
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - '.github/workflows/build-apps.yml'
permissions:
  contents: write
  checks: write
jobs:
  android:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/android } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install --no-audit --no-fund
      - run: npx cap add android
      - name: Camera permission
        run: |
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />#' android/app/src/main/AndroidManifest.xml
          grep -n CAMERA android/app/src/main/AndroidManifest.xml
      - name: App icon
        continue-on-error: true
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#0E6655' --splashBackgroundColor '#F3F5F2'
      - run: npx cap sync android
      - name: Build APK
        working-directory: apps/android/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk ../../hajj-catering.apk
      - uses: actions/upload-artifact@v4
        with: { name: apk, path: hajj-catering.apk }

  windows:
    runs-on: windows-latest
    defaults: { run: { working-directory: apps/desktop } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-audit --no-fund
      - run: npm run dist
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
      - uses: actions/upload-artifact@v4
        with: { name: exe, path: apps/desktop/dist/hajj-catering-setup.exe }

  publish:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: downloads, merge-multiple: true }
      - name: Update GitHub release
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: |
          ls -la downloads
          gh release view apps-latest >/dev/null 2>&1 || gh release create apps-latest --title "تطبيقات إعاشة الحجاج" --notes "أحدث نسخة من تطبيق أندرويد وتطبيق ويندوز"
          gh release upload apps-latest downloads/hajj-catering.apk downloads/hajj-catering-setup.exe --clobber
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HAJJ_CATERING_URCC }}
          channelId: live
          projectId: hajj-catering-urcc
